name: Atualizar site

on:
  schedule:
    # 22:30 UTC em dias úteis = após o fechamento americano; EOD do Yahoo já é final.
    - cron: "30 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "p_e.xlsx"
      - "Catalogo_de_ETFs.xlsx"
      - "index.html"
      - "build.py"
      - "fetch_yahoo.py"
      - "fetch_pe.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  # contents: write porque o data.json passou a ser ACUMULADOR, não saída
  # descartável: o Yahoo já retirou fechamento que havia publicado, e sem o
  # arquivo do run anterior no repo não há como recuperar o ponto perdido.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Gerar data.json (Técnico MM200) do Yahoo Finance
        run: python fetch_yahoo.py

      - name: Gerar pe.json e catalogo.json a partir do Excel
        run: python build.py --no-tec

      - name: Estender P/E até hoje (série Bloomberg + preço Yahoo)
        run: python fetch_pe.py

      - name: Persistir data.json (acumulador contra retirada de dado pelo Yahoo)
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json sem mudança — nada a commitar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: técnico MM200 do Yahoo ($(date -u +%Y-%m-%d))"
          # 'data.json' não está no filtro `paths` do trigger de push, então este
          # commit NÃO reinicia o workflow. O rebase cobre a corrida com um push
          # manual de p_e.xlsx que tenha entrado durante o build.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "tentativa $i falhou; repetindo"
            sleep 5
          done
          echo "::warning::não consegui persistir data.json; o site publica normalmente, mas o próximo run perde o acumulado"

      - name: Montar pasta do site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          cp pe.json _site/ 2>/dev/null || true
          cp pe_fwd.json _site/ 2>/dev/null || true
          cp catalogo.json _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
