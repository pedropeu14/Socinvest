name: Atualizar site

on:
  schedule:
    # 22:30 UTC em dias úteis = após o fechamento americano; EOD do Yahoo já é final.
    - cron: "30 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "p_e.xlsx"
      - "Catalogo_de_ETFs.xlsx"
      - "index.html"
      - "build.py"
      - "fetch_yahoo.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Gerar data.json (Técnico MM200) do Yahoo Finance
        run: python fetch_yahoo.py

      - name: Gerar pe.json e catalogo.json a partir do Excel
        run: python build.py --no-tec

      - name: Montar pasta do site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          cp pe.json _site/ 2>/dev/null || true
          cp catalogo.json _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
